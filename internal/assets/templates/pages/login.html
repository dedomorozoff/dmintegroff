{{ define "pages/login.html" }}
{{ template "partials/head.html" . }}
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <a href="/">
                <img src="/static/img/logo.png" alt="dmIntegroff"
                    style="max-width: 280px; width: 100%; height: auto; margin-bottom: 1rem;">
            </a>
            <p>Система управления интеграциями</p>
        </div>

        {{ if .error }}
        <div class="error-box">{{ .error }}</div>
        {{ end }}

        {{ if .autoRegister }}
        <div class="success-box"
            style="background-color: #d4edda; color: #155724; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; border: 1px solid #c3e6cb;">
            Демо-пользователь автоматически зарегистрирован. Войдите в систему.
        </div>
        {{ end }}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" value="{{ .username }}" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" value="{{ .password }}" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; justify-content: center;">
                Войти в систему
            </button>
        </form>
    </div>
</div>

{{ template "partials/scripts.html" . }}
{{ end }}
