<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/modern.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="/static/img/logo.png" alt="dmIntegroff" class="sidebar-logo-img">
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="/"><i data-lucide="layout-dashboard"></i> Обзор</a></li>
                <li><a href="/projects" class="active"><i data-lucide="folder-kanban"></i> Проекты</a></li>
                <li><a href="/integrations"><i data-lucide="webhook"></i> Интеграции</a></li>
                <li><a href="/integrations/create"><i data-lucide="plus"></i> Создать</a></li>
                <li><a href="/logs"><i data-lucide="file-text"></i> Логи</a></li>
            </ul>
        </nav>
        
        <div class="sidebar-settings">
            <a href="/settings"><i data-lucide="settings"></i> Настройки</a>
            <a href="/help"><i data-lucide="help-circle"></i> Помощь</a>
        </div>
        
        <div class="sidebar-user">
            <div class="sidebar-user-info">
                <div class="sidebar-user-avatar">{{ if .role }}{{ slice .role 0 1 }}{{ else }}U{{ end }}</div>
                <div class="sidebar-user-details">
                    <h4>{{ if .role }}{{ .role }}{{ else }}Пользователь{{ end }}</h4>
                    <p>Активен</p>
                </div>
                <a href="/logout" class="logout-btn" title="Выйти">
                    <i data-lucide="log-out"></i>
                </a>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Создание проекта</h1>
            <p>Создайте новый проект для группировки интеграций</p>
        </div>

        <div class="card">
            <form method="POST" action="/projects">
                <div class="form-group">
                    <label for="name">Название проекта *</label>
                    <input type="text" id="name" name="name" required placeholder="Например: CRM Integration">
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" rows="4" placeholder="Краткое описание проекта"></textarea>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-success">Создать проект</button>
                    <a href="/projects" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
