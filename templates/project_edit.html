<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/static/css/modern.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="icon">🚀</span>
            <h1>dmIntegroff</h1>
        </div>
        
        <nav>
            <ul class="sidebar-nav">
                <li><a href="/"><span class="icon">📊</span> Главная</a></li>
                <li><a href="/projects" class="active"><span class="icon">📁</span> Проекты</a></li>
                <li><a href="/integrations"><span class="icon">🔗</span> Интеграции</a></li>
                <li><a href="/logs"><span class="icon">📝</span> Логи</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Редактирование проекта</h1>
            <p>Изменение информации о проекте</p>
        </div>

        <div class="card">
            <form method="POST" action="/projects/{{ .project.ID }}/update">
                <div class="form-group">
                    <label for="name">Название проекта *</label>
                    <input type="text" id="name" name="name" value="{{ .project.Name }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" rows="4">{{ .project.Description }}</textarea>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <a href="/projects/{{ .project.ID }}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
