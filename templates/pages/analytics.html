{{ define "pages/analytics.html" }}
{{ template "partials/head.html" . }}
{{ template "partials/sidebar.html" . }}

<main class="main-content">
    <div class="page-header">
        <h1>Аналитика</h1>
        <p>Обзор активности и производительности интеграций</p>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Фильтры</h2>
        </div>
        <div class="card-body">
            <form id="analytics-form" class="filter-form">
                <div class="form-group">
                    <label for="integration-select">Интеграция</label>
                    <select id="integration-select" name="integration_id">
                        <option value="">Все интеграции</option>
                        {{ range .integrations }}
                        <option value="{{ .ID }}" {{ if eq .ID $.integrationID }}selected{{ end }}>{{ .Name }}</option>
                        {{ end }}
                    </select>
                </div>
                <div class="form-group">
                    <label for="period-select">Период</label>
                    <select id="period-select" name="period">
                        <option value="24h" {{ if eq $.period "24h" }}selected{{ end }}>Последние 24 часа</option>
                        <option value="7d" {{ if eq $.period "7d" }}selected{{ end }}>Последние 7 дней</option>
                        <option value="30d" {{ if eq $.period "30d" }}selected{{ end }}>Последние 30 дней</option>
                        <option value="all" {{ if eq $.period "all" }}selected{{ end }}>За все время</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Применить</button>
            </form>
        </div>
    </div>

    <div class="stats-grid" id="stats-container">
        <!-- Статистика будет загружена здесь -->
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Активность по часам</h2>
        </div>
        <div class="card-body">
            <canvas id="activity-chart" height="100"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Статусы ответов</h2>
        </div>
        <div class="card-body">
            <canvas id="status-chart" height="100"></canvas>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('analytics-form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            loadAnalytics();
        });

        loadAnalytics();
    });

    let activityChart, statusChart;

    function loadAnalytics() {
        const integrationId = document.getElementById('integration-select').value;
        const period = document.getElementById('period-select').value;

        const url = `/api/analytics?period=${period}${integrationId ? '&integration_id=' + integrationId : ''}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                updateStats(data.stats);
                updateActivityChart(data.activity_by_hour);
                updateStatusChart(data.status_distribution);
                window.showNotification('Аналитика обновлена', 'success', { duration: 2000 });
            })
            .catch(error => {
                console.error('Error loading analytics:', error);
                window.showNotification('Ошибка загрузки аналитики', 'error');
            });
    }

    function updateStats(stats) {
        const container = document.getElementById('stats-container');
        container.innerHTML = `
            <div class="stat-card">
                <div class="stat-card-header">
                    <h3 class="stat-card-title">Всего запросов</h3>
                    <i data-lucide="bar-chart-2"></i>
                </div>
                <p class="stat-card-value">${stats.total_requests}</p>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <h3 class="stat-card-title">Успешных запросов</h3>
                    <i data-lucide="check-circle"></i>
                </div>
                <p class="stat-card-value">${stats.successful_requests}</p>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <h3 class="stat-card-title">Ошибок</h3>
                    <i data-lucide="alert-circle"></i>
                </div>
                <p class="stat-card-value">${stats.failed_requests}</p>
            </div>
            <div class="stat-card">
                <div class="stat-card-header">
                    <h3 class="stat-card-title">Среднее время ответа</h3>
                    <i data-lucide="timer"></i>
                </div>
                <p class="stat-card-value">${stats.avg_response_time_ms} мс</p>
            </div>
        `;
        lucide.createIcons();
    }

    function updateActivityChart(data) {
        const ctx = document.getElementById('activity-chart').getContext('2d');
        const labels = Object.keys(data).sort();
        const values = labels.map(label => data[label]);

        if (activityChart) {
            activityChart.destroy();
        }

        activityChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Запросы в час',
                    data: values,
                    backgroundColor: 'rgba(54, 162, 235, 0.5)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    function updateStatusChart(data) {
        const ctx = document.getElementById('status-chart').getContext('2d');
        const labels = Object.keys(data);
        const values = Object.values(data);
        const backgroundColors = labels.map(label => {
            if (label.startsWith('2')) return 'rgba(75, 192, 192, 0.5)';
            if (label.startsWith('4')) return 'rgba(255, 159, 64, 0.5)';
            if (label.startsWith('5')) return 'rgba(255, 99, 132, 0.5)';
            return 'rgba(201, 203, 207, 0.5)';
        });

        if (statusChart) {
            statusChart.destroy();
        }

        statusChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Статусы ответов',
                    data: values,
                    backgroundColor: backgroundColors,
                    hoverOffset: 4
                }]
            }
        });
    }
</script>
{{ end }}
