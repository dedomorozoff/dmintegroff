{{ define "pages/404.html" }}
{{ template "partials/head.html" . }}
<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <a href="https://dmintegroff.ru" target="_blank" rel="noopener noreferrer">
                <img src="/static/img/logo.png" alt="dmIntegroff"
                    style="max-width: 280px; width: 100%; height: auto; margin-bottom: 1rem;">
            </a>
            <h1 style="font-size: 4rem; margin: 1rem 0; color: var(--primary);">404</h1>
            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Страница не найдена</h2>
            <p style="margin-bottom: 2rem;">Похоже, эта страница ушла на интеграцию с другим измерением <i
                    data-lucide="rocket" style="display: inline-block; vertical-align: middle; margin-left: 5px;"></i>
            </p>
        </div>

        <div style="text-align: center;">
            <a href="/" class="btn" style="width: 100%; justify-content: center; margin-bottom: 0.5rem;">
                Вернуться на главную
            </a>
            <p style="margin-top: 1rem; color: var(--muted-foreground); font-size: 0.875rem;">
                Если вы считаете, что это ошибка, свяжитесь с администратором
            </p>
        </div>
    </div>
</div>

{{ template "partials/scripts.html" . }}
{{ end }}
