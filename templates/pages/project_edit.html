{{ define "pages/project_edit.html" }}
{{ template "partials/head.html" . }}
{{ template "partials/sidebar.html" . }}

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1>Редактирование проекта</h1>
            <p>Изменение информации о проекте</p>
        </div>
        
        <div class="page-header-mobile">
            <button class="mobile-menu-toggle" onclick="toggleMobileSidebar()" aria-label="Меню">
                <i data-lucide="menu"></i>
            </button>
            <a href="/dashboard">
                <img src="/static/img/logo.png" alt="dmIntegroff" class="page-header-logo">
            </a>
            <h1 class="page-header-title">Редактирование проекта</h1>
        </div>
        <div class="sidebar-overlay" onclick="closeMobileSidebar()"></div>

        <div class="card">
            <form method="POST" action="/projects/{{ .project.ID }}/update">
                <div class="form-group">
                    <label for="name">Название проекта *</label>
                    <input type="text" id="name" name="name" value="{{ .project.Name }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" rows="4">{{ .project.Description }}</textarea>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-success">Сохранить</button>
                    <a href="/projects/{{ .project.ID }}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>
    
    {{ template "partials/scripts.html" . }}
    
    <!-- AI Assistant -->
    {{ template "partials/ai_chat.html" . }}
{{ end }}
