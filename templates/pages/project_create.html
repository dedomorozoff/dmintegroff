{{ define "pages/project_create.html" }}
{{ template "partials/head.html" . }}
{{ template "partials/sidebar.html" . }}

    <!-- Main Content -->
    <main class="main-content">
        <div class="page-header">
            <h1>Создание проекта</h1>
            <p>Создайте новый проект для группировки интеграций</p>
        </div>

        <div class="card">
            <form method="POST" action="/projects">
                <div class="form-group">
                    <label for="name">Название проекта *</label>
                    <input type="text" id="name" name="name" required placeholder="Например: CRM Integration">
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" rows="4" placeholder="Краткое описание проекта"></textarea>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-success">Создать проект</button>
                    <a href="/projects" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>
    
    {{ template "partials/scripts.html" . }}
{{ end }}
