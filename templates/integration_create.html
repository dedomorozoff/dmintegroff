<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{{ .title }}</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
            background-color: #f0f2f5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        small {
            color: #999;
            display: block;
            margin-top: 0.25rem;
            font-size: 0.85rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            margin-left: 1rem;
            color: #666;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Новая интеграция</h1>
        <div class="info-box">
            <strong>ℹ️ Как это работает:</strong><br>
            1. Создайте интеграцию<br>
            2. Получите уникальный webhook URL<br>
            3. Отправьте тестовый запрос на этот URL<br>
            4. Настройте маппинг полей<br>
            5. Активируйте интеграцию
        </div>
        <form method="POST" action="/integrations">
            <div class="form-group">
                <label>Название интеграции</label>
                <input type="text" name="name" required placeholder="Например: Интеграция CRM -> Email">
            </div>
            <div class="form-group">
                <label>Target API URL</label>
                <input type="text" name="target_api" required placeholder="https://api.example.com/endpoint">
                <small>Куда будут отправляться преобразованные данные</small>
            </div>
            <div class="form-group">
                <label>Source API (опционально)</label>
                <input type="text" name="source_api" placeholder="https://source.example.com">
                <small>Для документации, откуда ожидаются данные</small>
            </div>
            <button type="submit">Создать интеграцию</button>
            <a href="/integrations">Отмена</a>
        </form>
    </div>
</body>

</html>
